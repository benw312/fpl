name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # The oracle extra (scipy) lets the MILP oracle tests run instead of skipping
      - run: pip install -e ".[dev,oracle]"
      - run: pytest -q
