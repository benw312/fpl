[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fpl-cli"
version = "0.1.0"
description = "A local Fantasy Premier League planning CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  # A straight runtime dependency, not an optional extra (FU-26). The
  # optimiser's scoring kernel is numpy; a pure-Python fallback would be a
  # second expression of the objective and a second place for it to drift.
  "numpy>=1.26,<3",
  "prompt-toolkit>=3.0,<4",
  "pydantic>=2.7,<3",
  "rich>=13.7,<14",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "respx>=0.21,<1",
]
# FU-72: the plan oracle in tools/ solves the true optimum as a MILP (scipy's
# milp, i.e. HiGHS). Diagnostics only — nothing under src/ may import scipy, and
# its tests skip when it is absent.
oracle = [
  "scipy>=1.11,<2",
]

[project.scripts]
fpl = "fpl_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
